# ------------------------------------------------------------
#  Grote foto's op de homepage
#  Zet een nieuwe foto in de map assets/img/achtergrond/ en
#  vervang hieronder de bestandsnaam. Liggende foto's (breder dan hoog),
#  minimaal 2000 pixels breed, werken het best.
#
#  positie = welk deel van de foto zichtbaar blijft als hij wordt bijgesneden,
#  bijvoorbeeld "center", "center top" of "center 70%".
# ------------------------------------------------------------

# Bovenaan de homepage, direct onder het logo
hero:
  foto: /assets/img/achtergrond/les-monts-1.jpg
  positie: center 60%
  alt: Plukkisten tussen de rijen wijnstokken tijdens de oogst

# Blijft staan terwijl de tekst over ons eroverheen schuift
verhaal:
  foto: /assets/img/achtergrond/les-monts-2.jpg
  positie: center 70%
  alt: Wijnmaker loopt door een jonge wijngaard onder een wolkenlucht

# Achtergrond van het Hedonist-blok op de homepage
hedonist:
  foto: /assets/img/hedonist/hedonist-9.jpg
  positie: right center
  alt: Lichtlijn langs de bol van een Hedonist glas

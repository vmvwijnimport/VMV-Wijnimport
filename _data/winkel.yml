# ------------------------------------------------------------
#  Hedonist glazen bestellen (tot 22 nov 2026 een pre-order)
#  Prijzen in euro's, met een punt als decimaalteken (32.75).
#  Zet open op false om de winkel van de site te halen.
# ------------------------------------------------------------

open: true
kop: Bestel Hedonist glazen
levering: binnen 2 tot 5 werkdagen
# Op de Engelse pagina (/en/hedonist/)
kop_en: Order Hedonist glasses
levering_en: within 2 to 5 working days

# Prijs per glas, en de prijs voor elke 6 glazen van hetzelfde model (niet mixen).
# Met prijs_glas_normaal en prijs_zes_normaal erbij staat de normale prijs doorgestreept (zoals bij de pre-order).
prijs_glas: 34.50
prijs_zes: 195.00

# Verzending
verzendkosten: 12.50            # inclusief verzekering
gratis_verzenden_vanaf: 12      # glazen, overal in Nederland
gratis_amsterdam_vanaf: 6       # glazen, bezorgd door ons in Amsterdam

# Ophalen (altijd gratis)
ophalen:
  naam: Oocker
  adres: Frederiksplein 29h, 1017 XL Amsterdam

# Betalen via Mollie (iDEAL en bankoverschrijving). Zie betalen/INSTELLEN.md.
# Zolang actief op false staat, komt de bestelling alleen per mail binnen en
# sturen jullie zelf een betaallink.
betalen:
  actief: true
  koppeling: "https://vmv-betalen.winter-dawn-d1b9.workers.dev"        # adres van de Cloudflare Worker, bijv. https://vmv-betalen.jouwnaam.workers.dev

modellen:
  - id: breed
    naam: HEDONIST Glas
    omschrijving: Het brede glas, voor wijnen die ruimte en lucht nodig hebben, zoals bourgogne, nebbiolo en champagne met meer volume.
    omschrijving_en: The wide glass, for wines that need space and air, such as Burgundy, Nebbiolo and fuller-bodied Champagne.
    foto: /assets/img/hedonist/hedonist-1.jpg
  - id: white
    naam: HEDONIST Glas "White"
    omschrijving: Het smallere glas, voor frisse champagnes en frissere witte wijnen, zoals riesling.
    omschrijving_en: The narrower glass, for fresh Champagnes and crisper white wines, such as Riesling.
    foto: /assets/img/hedonist/hedonist-8.jpg

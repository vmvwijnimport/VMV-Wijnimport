# ------------------------------------------------------------
#  VMV Wijnimport — algemene instellingen
#  Na het aanpassen van dit bestand duurt het 1-2 minuten
#  voordat GitHub Pages de site opnieuw heeft gebouwd.
# ------------------------------------------------------------

title: VMV Wijnimport
tagline: Wijnen van de nieuwe generatie
description: >-
  We importeren champagne en wijn van een nieuwe generatie wijnmakers. Ze werken zonder pesticiden of herbiciden en voegen in de kelder zo weinig mogelijk toe.
lang: nl_NL
locale: nl_NL

# Het adres van de website. Nu het tijdelijke GitHub-adres.
# Koppel je www.vmvwijnimport.com, zet dan url op "https://www.vmvwijnimport.com"
# en baseurl op "" (leeg).
url: "https://vmvwijnimport.github.io"
# Laat leeg bij een eigen domein. Gebruik je het standaard GitHub-adres
# (gebruikersnaam.github.io/VMV-Wijnimport), zet hier dan "/VMV-Wijnimport".
baseurl: "/VMV-Wijnimport"

logo: /brand/logo/png/vmv-logo-1024.png

# Zichtbaar in Google en andere zoekmachines?
# false = de site wordt niet opgenomen in zoekresultaten (voor de lancering).
# Zet op true als de site officieel live mag.
zoekmachines: false

# Bedrijfsgegevens — staan in de footer en in de algemene voorwaarden.
# Gevonden in openbare registers; controleer ze in je KvK-uittreksel.
bedrijf:
  naam: VMV Wijnimport B.V.
  kvk: "99082918"
  btw: NL868786901B01
  # Het adres staat alleen in de algemene voorwaarden (wettelijk verplicht bij
  # verkoop op afstand), niet in de footer of de privacyverklaring.
  adres: Theophile de Bockstraat 97-H
  postcode: 1058 VC
  plaats: Amsterdam
  telefoon: 06 15 74 23 32
  telefoon_link: "+31615742332"

# Contactgegevens — worden overal op de site gebruikt
email: info@vmvwijnimport.com
whatsapp_url: https://wa.me/message/7A7JGLEONUS3E1
opgericht: november 2024

# Formulier: berichten gaan via FormSubmit naar het e-mailadres hierboven.
# De eerste keer krijg je een bevestigingsmail van FormSubmit: klik op de link.
formulier_endpoint: https://formsubmit.co/ajax/info@vmvwijnimport.com

# ------------------------------------------------------------
#  Producenten — elk bestand in de map _producenten is een producent
# ------------------------------------------------------------
collections:
  producenten:
    output: true
    permalink: /producenten/:name/

defaults:
  - scope:
      path: ""
      type: producenten
    values:
      layout: producent
  - scope:
      path: ""
    values:
      layout: pagina
      image: /brand/logo/png/vmv-logo-1024.png

plugins:
  - jekyll-sitemap

markdown: kramdown

exclude:
  - HANDLEIDING.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude
  - prijslijst
  - foto-originelen
  - huisstijl
  - betalen
  - CLAUDE.md
  - docs
  - supabase

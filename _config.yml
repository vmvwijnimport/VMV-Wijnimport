# ------------------------------------------------------------
#  VMV Wijnimport — algemene instellingen
#  Na het aanpassen van dit bestand duurt het 1-2 minuten
#  voordat GitHub Pages de site opnieuw heeft gebouwd.
# ------------------------------------------------------------

title: VMV Wijnimport
tagline: Wijnen van de nieuwe generatie
description: >-
  We importeren champagne en wijn van een nieuwe generatie wijnmakers. Ze werken zonder pesticiden of herbiciden en voegen in de kelder zo weinig mogelijk toe.
lang: nl_NL
locale: nl_NL

# Het adres van de website: het eigen domein (bestand CNAME). Het oude adres
# vmvwijnimport.github.io/VMV-Wijnimport stuurt GitHub vanzelf hierheen door.
url: "https://vmvwijnimport.com"
# Leeg bij een eigen domein. Zonder eigen domein zou hier "/VMV-Wijnimport" staan.
baseurl: ""

logo: /brand/logo/png/vmv-logo-1024.png

# Zichtbaar in Google en andere zoekmachines?
# false = de site wordt niet opgenomen in zoekresultaten (voor de lancering).
# Zet op true als de site officieel live mag.
zoekmachines: false

# Wachtpagina: zolang dit op true staat, tonen alle pagina's alleen "Binnenkort online",
# behalve de pagina's in de lijst hieronder. Zet op false om de volledige site te tonen.
wachtpagina: true
# Deze pagina's blijven werken zolang de wachtpagina aan staat: het horecaportaal,
# de backoffice, de pagina's waar de mails naar linken, en de pagina waar je na
# het betalen terugkomt.
wachtpagina_open:
  - /horeca/
  - /horeca/beheer/
  - /algemene-voorwaarden/
  - /privacy/
  - /bestelling/

# Bedrijfsgegevens — staan in de footer en in de algemene voorwaarden.
# Gevonden in openbare registers; controleer ze in je KvK-uittreksel.
bedrijf:
  naam: VMV Wijnimport B.V.
  kvk: "99082918"
  btw: NL868786901B01
  # Het adres staat alleen in de algemene voorwaarden (wettelijk verplicht bij
  # verkoop op afstand), niet in de footer of de privacyverklaring.
  adres: Theophile de Bockstraat 97-H
  postcode: 1058 VC
  plaats: Amsterdam
  telefoon: 06 15 74 23 32
  telefoon_link: "+31615742332"

# Contactgegevens — worden overal op de site gebruikt
email: info@vmvwijnimport.com
whatsapp_url: https://wa.me/message/7A7JGLEONUS3E1
opgericht: november 2024

# Horecaportaal (Supabase). Deze twee waarden zijn openbaar en mogen in de site;
# de beveiliging zit in de database (Row Level Security). Zet hier NOOIT de
# secret- of service_role-sleutel.
horeca:
  supabase_url: https://iemduldvpylppckpttja.supabase.co
  supabase_key: sb_publishable_w0sVLgS2_qy-HdTgVyvfqw_xpahvjXV
  # "resend": de database verstuurt de bestelmails zelf (supabase/005). "formsubmit" alleen als Resend niet naar klanten mailt
  klantmail: resend

# Formulier: berichten gaan via FormSubmit naar het e-mailadres hierboven.
# De eerste keer krijg je een bevestigingsmail van FormSubmit: klik op de link.
formulier_endpoint: https://formsubmit.co/ajax/info@vmvwijnimport.com

# ------------------------------------------------------------
#  Producenten — elk bestand in de map _producenten is een producent
# ------------------------------------------------------------
collections:
  producenten:
    output: true
    permalink: /producenten/:name/

defaults:
  - scope:
      path: ""
      type: producenten
    values:
      layout: producent
  - scope:
      path: ""
    values:
      layout: pagina
      image: /brand/logo/png/vmv-logo-1024.png

plugins:
  - jekyll-sitemap

markdown: kramdown

exclude:
  - HANDLEIDING.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude
  - prijslijst
  - foto-originelen
  - huisstijl
  - betalen
  - CLAUDE.md
  - docs
  - supabase

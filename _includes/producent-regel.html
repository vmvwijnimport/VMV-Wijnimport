{%- assign p = include.p -%}
<li class="producentregel{% if include.extra %} producentregel--extra{% endif %}">
  <a href="{{ p.url | relative_url }}">
    {%- if p.foto %}
    <span class="producentregel__foto{% if p.lijst_passend %} producentregel__foto--passend{% endif %}"><img src="{{ p.lijst_foto | default: p.foto | relative_url }}" alt="" loading="lazy" style="object-position: {{ p.foto_positie | default: 'center' }}"></span>
    {%- else %}
    <span class="producentregel__foto producentregel__foto--leeg"><span class="stippen" aria-hidden="true"><i></i><i></i><i></i></span></span>
    {%- endif %}
    <span class="producentregel__naam">{{ p.naam }}</span>
    <span class="producentregel__plek">{{ p.plaats }}</span>
    {%- if p.samenvatting %}<span class="producentregel__samenvatting">{{ p.samenvatting }}</span>{% elsif p.cuvees.size > 0 %}<span class="producentregel__samenvatting">{{ p.cuvees.size }} {% if p.cuvees.size == 1 %}cuvée{% else %}cuvées{% endif %}</span>{% endif %}
  </a>
</li>

<!doctype html>
<html lang="nl">
<head>
{% include head.html %}
</head>
{%- if site.wachtpagina and page.url == "/" %}
<body class="wacht">
  {% include wachtpagina.html %}
</body>
{%- else %}
<body class="{{ page.body_class }}">
  <a class="naar-inhoud" href="#inhoud">Naar de inhoud</a>
  {% include header.html %}
  <main id="inhoud">
    {{ content }}
  </main>
  {% include footer.html %}
  {% include leeftijdscheck.html %}
</body>
{%- endif %}
</html>
